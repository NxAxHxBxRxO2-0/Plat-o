<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Platão</title>

    <style>
        header {
            background-color: #36FF04;
            color: #000000;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
            border: 5px solid;
            color: rgb(0, 0, 0);

        }

        main {
            background-color: #ff9500;
            color: black;
            text-align: center;
            max-width: 800px;
            margin: 0 auto;
            padding: 16px;
        }
        article{
            display: flex;
        }

        img {
            width: 80px;
            height: 80px;
            border: 6px solid;
            color: #ff9500;

        
        }

        .artigo-autor {
            font-weight: bold;
        }
    </style>
</head>

<body>
    <header>
        <h1>Platão</h1>
        <p>O maior filósofo da Antiguidade grega</p>
    </header>

    <main>
        <article>
            
            <img src="Platão.png"
                alt="Ilustração em arte pixelada (pixel art) de um filósofo grego antigo, remetendo a Platão. Um homem idoso com pele bronzeada, cabelos e barba longa brancos, e uma expressão pensativa. Ele está apoiando o queixo na mão direita e segura um pergaminho enrolado com a mão esquerda. Veste uma túnica cinza-esverdeada. Ao fundo, há uma estrutura arquitetônica clássica com colunas e, ao longe, o que parece ser o Partenon sob um céu azul claro.">
            <div>
                <h2>Conhecer Platão e suas ideias</h2>
                <p class="artigo-autor"> Por: Wesley Machado</p>
                <p>Irei compartilhar sobre Platão</p>
                <button>😈 <span>0</span></button>
                <button>🙀 <span>0</span></button>
            </div>
        </article>
     </main>
</body>
<script>

    const botoes = document.querySelectorAll("button");
    botoes.forEach(function(botao){
        botao.addEventListener("click", botaoClicado);
        function botaoClicado() {
          console.log("fui clicado");
          let texto = botao.querySelector("span");
          texto.textContent++;
        }
     }
        
    )
</script>

</html>
